<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ava CRM — Painel Administrativo</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="../images/logo_v4.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="dark-theme">

  <!-- LOGIN OVERLAY -->
  <div id="loginOverlay" class="login-overlay">
    <div class="login-card">
      <img src="../images/logo_white_v4.png" alt="Logo" class="login-logo" id="loginLogo">
      <h2>Ava<span>Admin</span></h2>
      <p class="login-sub">Acesso restrito</p>
      <form id="loginForm">
        <input type="email" id="adminEmail" placeholder="E-mail" required>
        <input type="password" id="adminPassword" placeholder="Senha" required>
        <button type="submit" id="loginBtn">Entrar no Painel</button>
        <div id="loginError" class="login-error"></div>
      </form>
    </div>
  </div>

  <!-- ADMIN PANEL -->
  <div id="adminPanel" class="admin-panel" style="display:none;">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img src="../images/logo_white_v4.png" alt="Logo" class="sidebar-logo" id="sidebarLogo">
        <div><strong>Ava</strong>CRM</div>
      </div>
      <nav class="sidebar-nav">
        <a href="#" class="nav-item active"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg> Leads</a>
        <a href="../index.html" class="nav-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg> Voltar ao Chat</a>
      </nav>
      <div class="sidebar-footer">
        <button id="themeToggle" class="nav-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg> <span id="themeLabel">Modo claro</span></button>
        <button id="logoutBtn" class="nav-item logout"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Sair</button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="main-header">
        <div>
          <h1>Leads</h1>
          <p class="header-sub">Gerencie seus contatos qualificados</p>
        </div>
        <button id="refreshBtn" class="btn-refresh"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg> Atualizar</button>
      </header>

      <!-- Stats -->
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-icon total">👥</div><div><div class="stat-label">Total</div><div class="stat-value" id="statTotal">0</div></div></div>
        <div class="stat-card"><div class="stat-icon new">🆕</div><div><div class="stat-label">Novos Hoje</div><div class="stat-value" id="statNew">0</div></div></div>
        <div class="stat-card"><div class="stat-icon contacted">📞</div><div><div class="stat-label">Contatados</div><div class="stat-value" id="statContacted">0</div></div></div>
        <div class="stat-card"><div class="stat-icon meeting">📅</div><div><div class="stat-label">Reuniões</div><div class="stat-value" id="statMeetings">0</div></div></div>
      </div>

      <!-- Filters -->
      <div class="filter-bar">
        <input type="text" id="searchInput" class="search-input" placeholder="Buscar por nome, empresa ou telefone...">
        <select id="segmentFilter" class="filter-select">
          <option value="">Todos os segmentos</option>
          <option value="automotivo">Automotivo</option>
          <option value="saude">Saúde / Estética</option>
          <option value="tecnologia">Tecnologia</option>
          <option value="servicos">Serviços</option>
          <option value="varejo">Varejo</option>
          <option value="outro">Outro</option>
        </select>
        <select id="statusFilter" class="filter-select">
          <option value="">Todos os status</option>
          <option value="new">Novo</option>
          <option value="contacted">Contatado</option>
          <option value="meeting">Reunião</option>
          <option value="closed">Fechado</option>
        </select>
      </div>

      <!-- Table -->
      <div class="table-container">
        <table class="leads-table">
          <thead>
            <tr>
              <th>Nome / Empresa</th>
              <th>WhatsApp</th>
              <th>E-mail</th>
              <th>Segmento</th>
              <th>Data</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="leadsTableBody">
            <tr><td colspan="7"><div class="empty-state"><div class="empty-icon">📋</div><p>Carregando leads...</p></div></td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore-compat.js"></script>
  <script src="admin.js"></script>
</body>
</html>
