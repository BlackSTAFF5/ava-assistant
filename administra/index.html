<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ava Painel - CRM Administrativo</title>
    <link rel="stylesheet" href="admin.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body>

    <!-- OVERLAY DE LOGIN -->
    <div id="loginOverlay" class="login-overlay">
        <div class="login-card">
            <div class="login-header-logo">
                <img src="../images/logo_white_v4.png" alt="Ava Logo" class="login-logo" id="loginLogo" style="width: 32px; height: 32px; object-fit: contain;">
                <h2>Ava <span>Painel</span></h2>
            </div>
            <p class="login-sub">Acesso restrito</p>
            <form id="adminLoginForm">
                <div class="form-group">
                    <label>E-mail Corporativo</label>
                    <input type="email" id="adminEmail" required placeholder="admin@avaassistant.cloud">
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="adminPassword" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-login" id="btnLogin">Entrar no Painel</button>
            </form>
            <p id="loginError" class="login-error"></p>
        </div>
    </div>

    <!-- ESTRUTURA SPA DO PAINEL -->
    <div id="app-container" style="display: none;" class="layout-wrapper">
        
        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-brand">
                    <img src="../images/logo_white_v4.png" alt="Ava Logo" class="sidebar-logo" id="sidebarLogo" style="width: 24px; height: 24px; object-fit: contain;">
                    <div class="brand-text"><strong>Ava</strong> <span class="brand-accent">Painel</span></div>
                </div>
                <button class="btn-close-sidebar" id="btnCloseSidebar">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>

            <nav class="sidebar-nav">
                <a href="#leads" class="nav-item active" data-view="leads">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                    <span>Leads</span>
                </a>
                <a href="#conversas" class="nav-item" data-view="conversas">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    <span>Conversas</span>
                </a>
                <a href="#reunioes" class="nav-item" data-view="reunioes">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                    <span>Reuniões</span>
                </a>
                <a href="#relatorios" class="nav-item" data-view="relatorios">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
                    <span>Relatórios</span>
                </a>
                <a href="#configuracoes" class="nav-item" data-view="configuracoes">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                    <span>Configurações</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <button class="nav-item btn-theme-toggle" id="btnThemeToggle">
                    <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                    <svg class="icon-moon" style="display:none;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                    <span class="theme-text">Modo claro</span>
                </button>
                <button class="nav-item text-danger" id="btnLogout">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    <span>Sair</span>
                </button>
            </div>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <main class="main-content">
            <!-- Header Móvel -->
            <header class="mobile-header">
                <button class="btn-menu" id="btnOpenMenu">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
                <div class="mobile-brand">Ava Painel</div>
            </header>

            <header class="view-header">
                <div class="view-title">
                    <h1 id="headerTitle">Carregando...</h1>
                    <p id="headerSubtitle">Aguarde</p>
                </div>
                <div class="view-actions" id="headerActions">
                    <!-- Botões dinâmicos da view -->
                </div>
            </header>

            <div id="view-container" class="view-container">
                <!-- Views injetadas via JS -->
            </div>
        </main>
    </div>

    <!-- COMPONENTES GLOBAIS -->
    <div id="toastContainer" class="toast-container"></div>

    <div id="globalLoading" class="global-loading">
        <div class="spinner"></div>
    </div>

    <div id="globalConfirm" class="modal-overlay" style="display: none;">
        <div class="modal-card confirm-card">
            <h3 id="confirmTitle">Confirmar Ação</h3>
            <p id="confirmMessage">Você tem certeza?</p>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="btnCancelConfirm">Cancelar</button>
                <button class="btn btn-danger" id="btnAcceptConfirm">Confirmar</button>
            </div>
        </div>
    </div>

    <!-- Scripts da Aplicação (Módulos) -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
